name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Run offline unit tests
        run: pytest
        env:
          # Unit tests must never call live TWSE/TPEx endpoints.
          PYTHONPATH: backend
